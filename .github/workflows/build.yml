name: Build СЯзык Full (aarch64 Android)

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git

      - name: Download and setup Android NDK
        run: |
          NDK_VERSION=r27c
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Clone LLVM 23.x
        run: |
          git clone --depth=1 --branch release/23.x \
            https://github.com/llvm/llvm-project.git

      - name: Apply СЯзык patch
        run: |
          chmod +x .github/patches/apply_sclang.sh
          cd llvm-project
          ../.github/patches/apply_sclang.sh

      - name: Build native tblgen tools (x86_64)
        run: |
          cd llvm-project
          cmake -S llvm -B build-native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF
          ninja -C build-native llvm-tblgen clang-tblgen

      - name: Cross-compile full Clang toolchain for Android aarch64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          REPO_ROOT="$(pwd)"
          cd llvm-project

          cmake -S llvm -B build-cross \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DANDROID_ALLOW_UNDEFINED_SYMBOLS=ON \
            -DCMAKE_INSTALL_PREFIX="$REPO_ROOT/sclang-install" \
            \
            -DLLVM_ENABLE_PROJECTS="clang;lld;compiler-rt;clang-tools-extra" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android \
            \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON \
            \
            -DLLVM_TABLEGEN="$REPO_ROOT/llvm-project/build-native/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$REPO_ROOT/llvm-project/build-native/bin/clang-tblgen" \
            -DLLVM_NATIVE_BUILD="$REPO_ROOT/llvm-project/build-native" \
            \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DCROSS_TOOLCHAIN_FLAGS_NATIVE='-DCMAKE_C_COMPILER=cc;-DCMAKE_CXX_COMPILER=c++' \
            \
            -DCOMPILER_RT_BUILD_BUILTINS=ON \
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF \
            -DCOMPILER_RT_BUILD_PROFILE=ON \
            -DCOMPILER_RT_BUILD_XRAY=OFF \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
            -DCOMPILER_RT_BUILD_MEMPROF=OFF \
            -DCOMPILER_RT_BUILD_ORC=OFF \
            \
            -DRUNTIMES_LIBCXX_ENABLE_SHARED=OFF \
            -DRUNTIMES_LIBCXX_ENABLE_STATIC=ON \
            -DRUNTIMES_LIBCXX_CXX_ABI=libcxxabi \
            -DRUNTIMES_LIBCXXABI_ENABLE_SHARED=OFF \
            -DRUNTIMES_LIBCXXABI_ENABLE_STATIC=ON \
            -DRUNTIMES_LIBCXXABI_USE_LLVM_UNWINDER=ON \
            -DRUNTIMES_LIBUNWIND_ENABLE_SHARED=OFF \
            -DRUNTIMES_LIBUNWIND_ENABLE_STATIC=ON

          ninja -C build-cross
          ninja -C build-cross install


      - name: Strip all binaries
        run: |
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          find sclang-install/bin -type f | while read -r f; do
            if file "$f" | grep -q "ELF"; then
              "$STRIP" "$f"
              echo "Stripped: $f"
            fi
          done

      - name: Build termux-elf-cleaner and clean all binaries
        run: |
          git clone --depth=1 --branch v3.0.1 \
            https://github.com/termux/termux-elf-cleaner.git
          cd termux-elf-cleaner
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          find ../sclang-install/bin -type f | while read -r f; do
            if file "$f" | grep -q "ELF"; then
              ./build/termux-elf-cleaner "$f"
              echo "Cleaned: $f"
            fi
          done

      - name: Create tarball
        run: |
          tar -czf sclang-full-aarch64-android.tar.gz sclang-install/

      - name: Upload full toolchain
        uses: actions/upload-artifact@v5
        with:
          name: sclang-full-aarch64-android
          path: sclang-full-aarch64-android.tar.gz
