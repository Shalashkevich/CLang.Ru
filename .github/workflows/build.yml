name: Build СЯзык (aarch64 static)

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 git \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross binutils-aarch64-linux-gnu

      - name: Clone LLVM 23.x
        run: |
          git clone --depth=1 --branch release/23.x \
            https://github.com/llvm/llvm-project.git

      - name: Apply СЯзык patch
        run: |
          chmod +x .github/patches/apply_sclang.sh
          cd llvm-project
          ../.github/patches/apply_sclang.sh

      - name: Build native tblgen tools (x86_64)
        run: |
          cd llvm-project
          cmake -S llvm -B build-native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF
          ninja -C build-native llvm-tblgen clang-tblgen

      - name: Cross-compile Clang for aarch64 (static)
        run: |
          REPO_ROOT="$(pwd)"
          cd llvm-project

          cmake -S llvm -B build-cross \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_TABLEGEN="$REPO_ROOT/llvm-project/build-native/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$REPO_ROOT/llvm-project/build-native/bin/clang-tblgen" \
            -DLLVM_NATIVE_BUILD="$REPO_ROOT/llvm-project/build-native" \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

          ninja -C build-cross clang

      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip llvm-project/build-cross/bin/clang

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
